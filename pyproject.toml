[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-datacenter"
version = "0.1.0"
description = "Benchmark de madurez operativa para data centers"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",
    "pyyaml==6.0.1",
    "sqlalchemy==2.0.30",
    "psycopg2-binary==2.9.9",
    "httpx==0.27.0",
    "python-ulid==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-cov==5.0.0",
    "hypothesis==6.104.2",
    "ruff==0.4.10",
    "mypy==1.10.1",
    "types-pyyaml==6.0.12.20240311",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
