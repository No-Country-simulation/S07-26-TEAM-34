# config/questionnaire.yaml — fuente única de preguntas, opciones y scores
# Versión: 1.0.0
# Basado en Documento_Metodologico_Benchmark.md (secciones 3-7)
# Estructura canónica usada por app/config/loader.py

version: "1.0.0"

# Campos de contexto del operador (doc §8) — no miden madurez
segmentation_fields:
  - id: "facility_size"
    label: "Tamaño aproximado del facility"
    options: ["<1MW", "1-5MW", "5-20MW", ">20MW"]

  - id: "dc_type"
    label: "Tipo de data center"
    options: ["hyperscale", "colocation", "enterprise", "edge"]

  - id: "region"
    label: "Región (continente o región amplia)"
    # Cerrado — doc §8: región amplia, no país exacto, para no comprometer
    # el anonimato. Mismos 5 valores usados en la calibración del dataset
    # público (config/dataset_publico_sintetico.csv), para que el match
    # exacto del Motor de grupos comparables (peer_group_engine) funcione.
    options: ["Norteamerica", "Latinoamerica", "Europa", "Asia-Pacifico", "Medio Oriente/Africa"]

dimensions:

  # ── 1. Latencia de coordinación (doc §3) ──────────────────────────────────
  latencia_coordinacion:
    label: "Latencia de coordinación"
    note: >
      Qué tan rápido se ajustan cooling y energía cuando cambia el workload,
      y cuánto de ese ajuste depende de intervención humana.
    index_formula: "(score_p1 + score_p2 + score_p3) / 3"
    questions:
      - id: "lat_p1_minutos_cooling"
        prompt: "¿Aproximadamente cuánto tiempo tarda en ajustarse el cooling tras un cambio significativo de carga de trabajo?"
        type: "numeric"
        scoring:
          buckets:
            - max_inclusive: 5
              score: 100
            - max_inclusive: 60
              score: 75
            - max_inclusive: 240
              score: 50
            - max_inclusive: 1440
              score: 25
            - max_inclusive: null
              score: 0

      - id: "lat_p2_minutos_energia"
        prompt: "¿Y la asignación de energía/potencia frente a ese mismo cambio de carga?"
        type: "numeric"
        scoring:
          buckets:
            - max_inclusive: 5
              score: 100
            - max_inclusive: 60
              score: 75
            - max_inclusive: 240
              score: 50
            - max_inclusive: 1440
              score: 25
            - max_inclusive: null
              score: 0

      - id: "lat_p3_automatizacion"
        prompt: "¿Ese ajuste requiere que una persona lo note y actúe, o está automatizado sin intervención?"
        type: "categorical_ordinal"
        options:
          - value: "automatizado"
            label: "Automatizado, sin intervención humana"
            score: 100
          - value: "alertas_manual"
            label: "Alertas automáticas, acción manual"
            score: 67
          - value: "reporte_periodico"
            label: "Reporte periódico + revisión manual"
            score: 33
          - value: "sin_proceso"
            label: "No hay proceso definido"
            score: 0

  # ── 2. Visibilidad cross-layer (doc §4) ───────────────────────────────────
  visibilidad_cross_layer:
    label: "Visibilidad cross-layer"
    note: >
      Si el operador tiene una vista unificada de energía, cooling y workload,
      o si cada capa se gestiona de forma aislada.
    index_formula: "(score_p1 + score_p2 + score_p3) / 3"
    questions:
      - id: "vis_p1_cantidad_sistemas"
        prompt: "¿Cuántas herramientas o sistemas distintos usan hoy para monitorear energía, cooling y workload respectivamente?"
        type: "numeric"
        scoring:
          buckets:
            - max_inclusive: 1
              score: 100
            - max_inclusive: 2
              score: 67
            - max_inclusive: 3
              score: 33
            - max_inclusive: null
              score: 0

      - id: "vis_p2_frecuencia_consolidacion"
        prompt: "¿Con qué frecuencia se cruza o consolida la información de las tres capas en un mismo reporte o vista?"
        type: "categorical_ordinal"
        options:
          - value: "tiempo_real"
            label: "Tiempo real / continuo"
            score: 100
          - value: "diario"
            label: "Diario"
            score: 75
          - value: "semanal"
            label: "Semanal"
            score: 50
          - value: "mensual_o_mas"
            label: "Mensual o más espaciado"
            score: 25
          - value: "nunca"
            label: "Nunca se cruza la información"
            score: 0

      - id: "vis_p3_acceso_vista_unificada"
        prompt: "¿Quién puede ver energía, cooling y workload juntos, en un mismo lugar, dentro de tu organización?"
        type: "categorical_ordinal"
        options:
          - value: "cualquiera"
            label: "Cualquier responsable puede verlas juntas en un solo lugar"
            score: 100
          - value: "un_rol"
            label: "Solo un rol específico las consolida manualmente para reportar"
            score: 50
          - value: "nadie"
            label: "Cada equipo ve solo su capa; nadie tiene la vista completa"
            score: 0

  # ── 3. Atribución de fricción (doc §5) ────────────────────────────────────
  atribucion_friccion:
    label: "Atribución de fricción"
    note: >
      En cuál de las tres interfaces entre capas percibe el operador que
      se pierde más capacidad, y qué tan basada en evidencia está esa percepción.
    index_formula: "(score_p2 + score_p3) / 2"
    questions:
      - id: "atr_p1_interfaz"
        prompt: "¿En cuál de estas interfaces sentís que se pierde más capacidad?"
        type: "categorical_nominal"
        options:
          - value: "energia_cooling"
            label: "Energía ↔ Cooling"
          - value: "cooling_workload"
            label: "Cooling ↔ Workload"
          - value: "workload_energia"
            label: "Workload ↔ Energía"
          - value: "no_sabria_decir"
            label: "No sabría decir"

      - id: "atr_p2_respaldo"
        prompt: "¿Existe algún reporte, log o medición concreta que respalde esta atribución?"
        type: "categorical_ordinal"
        options:
          - value: "con_medicion"
            label: "Sí, con reporte o medición concreta"
            score: 100
          - value: "estimacion"
            label: "Solo una estimación aproximada, sin registro formal"
            score: 50
          - value: "sin_evidencia"
            label: "No, es una apreciación sin evidencia registrada"
            score: 0

      - id: "atr_p3_vigencia"
        prompt: "¿Con qué frecuencia revisan o actualizan esta atribución?"
        type: "categorical_ordinal"
        options:
          - value: "revision_activa"
            label: "Se revisa activamente con cada cambio relevante"
            score: 100
          - value: "revision_periodica"
            label: "Se revisa periódicamente (por ejemplo, anual)"
            score: 50
          - value: "nunca_revisada"
            label: "Nunca se revisó desde que se formó la percepción inicial"
            score: 0

  # ── 4. Auto-cuantificación (doc §6) ───────────────────────────────────────
  auto_cuantificacion:
    label: "Auto-cuantificación"
    note: >
      Si el operador sabe, en números concretos, cuánta capacidad tiene varada,
      o si no tiene forma de cuantificarlo.
    index_formula: "(score_completitud_p1p2 + score_p3) / 2"
    questions:
      - id: "auto_p1_capacidad_instalada_mw"
        prompt: "¿Cuál es la capacidad instalada total de tu facility?"
        type: "numeric"

      - id: "auto_p2_capacidad_utilizable_mw"
        prompt: "¿Cuál es la capacidad máxima que podés usar hoy sin arriesgar estabilidad térmica/eléctrica?"
        type: "numeric"

      - id: "auto_p3_frecuencia_remedicion"
        prompt: "¿Con qué frecuencia se vuelve a medir este número?"
        type: "categorical_ordinal"
        options:
          - value: "continuamente"
            label: "Continuamente / en tiempo real"
            score: 100
          - value: "trimestral_semestral"
            label: "Trimestral o semestral"
            score: 67
          - value: "anual"
            label: "Anual"
            score: 33
          - value: "nunca_remedido"
            label: "Nunca se remidió"
            score: 0

  # ── 5. Bloqueantes (doc §7) ───────────────────────────────────────────────
  bloqueantes:
    label: "Bloqueantes"
    note: >
      Qué le impediría al operador resolver el problema si supiera exactamente
      dónde está: presupuesto, política, herramientas o personal.
    index_formula: "(score_cantidad_p1 + score_p2) / 2"
    questions:
      - id: "blk_p1_seleccionados"
        prompt: "Si supieras exactamente dónde está tu problema de coordinación, ¿qué te impediría resolverlo hoy? Podés marcar más de uno."
        type: "categorical_nominal_multiselect"
        score_por_cantidad:
          "0": 100
          "1": 67
          "2": 33
          "3_o_mas": 0
        options:
          - value: "presupuesto"
            label: "Presupuesto"
          - value: "autoridad_politica"
            label: "Falta de autoridad o decisión política interna"
          - value: "herramientas"
            label: "Falta de herramientas técnicas"
          - value: "personal"
            label: "Falta de personal capacitado"
          - value: "nada"
            label: "Nada, podríamos resolverlo"

      - id: "blk_p2_severidad"
        prompt: "¿Qué tan severo considerás ese bloqueante para resolver el problema en los próximos 6-12 meses?"
        type: "categorical_ordinal"
        options:
          - value: "no_es_real"
            label: "No es un bloqueante real, podríamos resolverlo si quisiéramos"
            score: 100
          - value: "moderado"
            label: "Obstáculo moderado, resoluble con esfuerzo"
            score: 67
          - value: "fuerte"
            label: "Obstáculo fuerte, poco probable resolverlo en el corto plazo"
            score: 33
          - value: "estructural"
            label: "Bloqueante estructural, no lo vemos resoluble en el corto plazo"
            score: 0
