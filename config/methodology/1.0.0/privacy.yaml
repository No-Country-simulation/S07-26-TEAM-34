# Configuración de privacidad — versión metodológica 1.0.0
# Valores de ejemplo; el equipo debe aprobar los definitivos.

version: "1.0.0"

# Tamaño mínimo de cohorte para calcular estadísticas
min_cohort_size: 5

# Tamaño mínimo para exponer prácticas del top quartile
min_top_quartile_support: 5

# Supresión: no exponer percentiles de grupos por debajo de este n efectivo
min_effective_n_for_percentile: 5

# Bandas para cuasi-identificadores (ya definidas en questionnaire.yaml)
# Aquí se documenta la política de generalización

quasi_identifier_policy:
  capacity_exact_mw: "Convertir siempre a capacity_band antes de persistir en zona analítica"
  facility_age_years: "Convertir a banda: <5, 5-10, 10-20, >20"
  precise_location: "Usar solo region band, nunca ciudad o coordenadas"

# Retención diferenciada
retention:
  contact_days: 90         # Email para entrega de PDF
  response_years: 5        # Respuestas pseudónimas
  result_years: 7          # Resultados generados
  audit_years: 7           # Log de auditoría
